<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Spotify · TPS-L2</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Override only what we need for centering */
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .connect-card {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 18px;
        backdrop-filter: blur(18px);
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.10);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        text-align: center;
        position: relative;
        z-index: 1; /* above background overlay */
      }

      .connect-title {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 10px;
      }

      .connect-subtitle {
        opacity: 0.8;
        margin: 0 0 22px;
        line-height: 1.4;
      }

      .connect-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-size: 16px;
        font-weight: 650;
        background: #1db954;
        color: white;
      }

      .connect-btn:hover {
        filter: brightness(1.03);
      }
      .connect-btn:active {
        transform: translateY(1px);
      }

      /* Link from a phone: for displays without a keyboard (the panel kiosk). */
      .qr {
        width: 200px;
        height: 200px;
        margin: 0 auto 14px;
        padding: 10px;
        border-radius: 14px;
        background: white;
      }

      .qr svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .qr-code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .connect-or {
        margin: 18px 0;
        opacity: 0.6;
        font-size: 14px;
      }

      [hidden] {
        display: none !important;
      }

      .connect-links {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .connect-links a {
        opacity: 0.75;
        text-decoration: none;
        font-size: 13px;
        color: inherit;
      }

      .connect-links a:hover {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="background-overlay"></div>

    <div class="connect-card">
      <h1 class="connect-title">Connect with Spotify</h1>
      <p class="connect-subtitle">
        Sign in to display your Now Playing dashboard.
      </p>

      <div id="qr-block" hidden>
        <div class="qr" id="qr"></div>
        <p class="connect-subtitle">
          Scan with your phone to link this display, or go to
          <strong id="qr-url"></strong> and enter <span class="qr-code" id="qr-code"></span>
        </p>
        <div class="connect-or">or</div>
      </div>

      <button class="connect-btn" id="connect-btn">Connect with Spotify</button>

      <div class="connect-links">
        <a href="/" id="go-dashboard">Go to dashboard</a>
        <a href="#" id="logout-link">Disconnect</a>
      </div>
    </div>

    <script type="module">
      import qrcode from "https://esm.sh/qrcode-generator@1.4.4";

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      // Show a link code as a QR code and wait for a phone to log in with it; when the
      // code expires (or anything fails), start over with a fresh one. The first code is
      // checked every few seconds; later ones, on a display left waiting, every 15 s.
      let codesShown = 0;
      async function linkFromPhone() {
        try {
          const r = await fetch("/api/device/start", { method: "POST" });
          if (!r.ok) throw new Error(`start ${r.status}`);
          const link = await r.json();
          const qr = qrcode(0, "M");
          qr.addData(link.verification_uri);
          qr.make();
          document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
          document.getElementById("qr-url").textContent = `${location.host}/link.html`;
          document.getElementById("qr-code").textContent = link.user_code;
          document.getElementById("qr-block").hidden = false;

          const interval = codesShown++ === 0 ? link.interval : Math.max(link.interval, 15);
          const deadline = Date.now() + link.expires_in * 1000;
          while (Date.now() < deadline) {
            await sleep(interval * 1000);
            const p = await fetch("/api/device/poll", {
              method: "POST",
              credentials: "include",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ device_code: link.device_code }),
            });
            if (p.status === 410) break;
            if (p.ok && (await p.json()).status === "linked") {
              window.location.href = "/";
              return;
            }
          }
        } catch {
          document.getElementById("qr-block").hidden = true;
          await sleep(10000);
        }
        linkFromPhone();
      }
      linkFromPhone();

      document.getElementById("connect-btn").addEventListener("click", () => {
        window.location.href = "/api/login";
      });

      document.getElementById("logout-link").addEventListener("click", async (e) => {
        e.preventDefault();
        try {
          await fetch("/api/logout", { method: "POST", credentials: "include" });
        } catch {}
      });
    </script>
  </body>
</html>
